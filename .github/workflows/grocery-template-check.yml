name: WordPress Studio isolation contract

on:
  pull_request:
    paths:
      - "admin/shared.js"
      - "admin/wordpress.html"
      - "admin/wordpress-live.html"
      - "admin/wordpress-templates.html"
      - "admin/website-builder.html"
      - "scripts/grocery-template-suite-check.mjs"
      - "WORDPRESS-BUILDER-ARCHITECTURE.md"
  push:
    branches: ["main"]
    paths:
      - "admin/shared.js"
      - "admin/wordpress.html"
      - "admin/wordpress-live.html"
      - "admin/wordpress-templates.html"
      - "admin/website-builder.html"
      - "scripts/grocery-template-suite-check.mjs"
      - "WORDPRESS-BUILDER-ARCHITECTURE.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check shared admin shell syntax
        run: node --check admin/shared.js
      - name: Verify independent WordPress Studio boundary
        run: node scripts/grocery-template-suite-check.mjs
