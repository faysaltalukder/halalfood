name: Grocery template and Neon API checks

on:
  pull_request:
    paths:
      - "admin/neon-builder-api.js"
      - "admin/wordpress-templates.*"
      - "admin/website-builder.*"
      - "database/migrations/20261106_*.sql"
      - "scripts/grocery-template-suite-check.mjs"
      - "WORDPRESS-BUILDER-ARCHITECTURE.md"
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check admin/neon-builder-api.js
          node --check admin/wordpress-templates.js
          node --check admin/website-builder.js
      - name: Run template and Neon integration contract
        run: node scripts/grocery-template-suite-check.mjs
