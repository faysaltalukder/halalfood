name: Admin Dashboard Quality Gate

on:
  push:
    branches: ["main"]
    paths:
      - "admin/**"
      - "supabase/functions/courier-integration/**"
      - "supabase/functions/facebook-publishing/**"
      - "supabase/functions/post-dispatcher/**"
      - "supabase/functions/site-publisher/**"
      - "supabase/migrations/**"
      - "scripts/admin-phase12-check.mjs"
      - ".github/workflows/admin-phase12-integrity.yml"
  pull_request:
    paths:
      - "admin/**"
      - "supabase/functions/courier-integration/**"
      - "supabase/functions/facebook-publishing/**"
      - "supabase/functions/post-dispatcher/**"
      - "supabase/functions/site-publisher/**"
      - "supabase/migrations/**"
      - "scripts/admin-phase12-check.mjs"
      - ".github/workflows/admin-phase12-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-integrity:
    name: Validate Phase 1–4 accessibility and integration integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Type-check changed Edge Functions
        run: |
          deno check supabase/functions/facebook-publishing/index.ts
          deno check supabase/functions/post-dispatcher/index.ts
          deno check supabase/functions/site-publisher/index.ts
      - name: Run final admin quality checks
        run: node scripts/admin-phase12-check.mjs
