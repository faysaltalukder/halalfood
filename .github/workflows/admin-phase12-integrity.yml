name: Admin Dashboard Quality Gate

on:
  push:
    branches: ["main"]
    paths:
      - "admin/**"
      - "js/live-catalog.js"
      - "js/cms-product.js"
      - "js/main.js"
      - "js/products-index.js"
      - "index.html"
      - "category.html"
      - "product.html"
      - "order.html"
      - "*.html"
      - "blog/**"
      - "categories/**"
      - "products/**"
      - "supabase/functions/courier-integration/**"
      - "supabase/functions/facebook-publishing/**"
      - "supabase/functions/post-dispatcher/**"
      - "supabase/migrations/**"
      - "scripts/admin-phase12-check.mjs"
      - ".github/workflows/admin-phase12-integrity.yml"
  pull_request:
    paths:
      - "admin/**"
      - "js/live-catalog.js"
      - "js/cms-product.js"
      - "js/main.js"
      - "js/products-index.js"
      - "index.html"
      - "category.html"
      - "product.html"
      - "order.html"
      - "*.html"
      - "blog/**"
      - "categories/**"
      - "products/**"
      - "supabase/functions/courier-integration/**"
      - "supabase/functions/facebook-publishing/**"
      - "supabase/functions/post-dispatcher/**"
      - "supabase/migrations/**"
      - "scripts/admin-phase12-check.mjs"
      - ".github/workflows/admin-phase12-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-integrity:
    name: Validate Phase 1–4 accessibility and integration integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Type-check changed Edge Functions
        run: |
          deno check supabase/functions/facebook-publishing/index.ts
          deno check supabase/functions/post-dispatcher/index.ts
      - name: Run final admin quality checks
        run: node scripts/admin-phase12-check.mjs
