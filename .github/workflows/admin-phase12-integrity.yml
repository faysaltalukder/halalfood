name: Admin Phase 1–2 Integrity

on:
  push:
    branches: ["main"]
    paths:
      - "admin/**"
      - "supabase/functions/courier-integration/**"
      - "scripts/admin-phase12-check.mjs"
      - ".github/workflows/admin-phase12-integrity.yml"
  pull_request:
    paths:
      - "admin/**"
      - "supabase/functions/courier-integration/**"
      - "scripts/admin-phase12-check.mjs"
      - ".github/workflows/admin-phase12-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-integrity:
    name: Validate Phase 1–2 dashboard integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run admin regression checks
        run: node scripts/admin-phase12-check.mjs
