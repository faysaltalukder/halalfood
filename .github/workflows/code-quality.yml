name: Repository Quality Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static source and Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Check repository structure and public secret exposure
        run: node scripts/repo-health.mjs

      - name: Test admin analytics model
        run: node --test tests/admin-analytics-model.test.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js' '*.mjs')

      - name: Type-check every deployed Edge Function source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            deno check "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name 'index.ts' -type f | sort)
