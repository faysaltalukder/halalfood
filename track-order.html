</style>

  <main class="card">
    <h1>Track Your Order</h1>
    <p class="lead">অর্ডারের বর্তমান অবস্থা দেখতে আপনার <b>Order ID</b> এবং অর্ডারে ব্যবহৃত <b>Mobile Number</b> দিন।</p>
    <form id="track-form">
      <div class="field"><label for="order-id">Order ID</label><input id="order-id" placeholder="যেমন: HF-1234" required autocomplete="off"></div>
      <div class="field"><label for="mobile">Mobile Number</label><input id="mobile" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX" required autocomplete="tel"></div>

        <div class="row"><span class="label">Courier</span><span class="value" id="r-courier">Not assigned yet</span></div>
        <div class="row"><span class="label">Tracking Number</span><span class="value" id="r-tracking">Not assigned yet</span></div>
        <div class="status" id="r-status"></div>
        <div class="timeline" id="timeline"></div>

<script>
const API="https://qfwvrcfkrsydycbfjsxf.supabase.co/functions/v1/order-track";
const steps=["Order Received","Confirmed","Processing","Packed","Shipped","Out for Delivery","Delivered"];
const $=s=>document.querySelector(s);
function money(v){return "৳ "+Number(v||0).toLocaleString("en-BD");}
function esc(v){const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML;}
function normalizeMobile(v){v=String(v||"").replace(/[^0-9+]/g,"");if(v.startsWith("+880"))return "0"+v.slice(4);if(v.startsWith("880")&&v.length===13)return "0"+v.slice(3);return v;}
function render(data){
  $("#r-id").textContent=data.orderId;
  $("#r-name").textContent=data.customerName||"Customer";
  $("#r-total").textContent=money(data.orderTotal);
  $("#r-courier").textContent=data.courier||"Not assigned yet";
  $("#r-tracking").textContent=data.trackingNumber||"Not assigned yet";
  const cancelled=data.statusCode==="cancelled";
  $("#r-status").textContent=cancelled?"Current Status: Order Cancelled":"Current Status: "+(data.status||"Order Received");
  $("#r-status").style.color=cancelled?"#9B2C25":"";
  const current=steps.indexOf(data.status);
  const timeline=$("#timeline");timeline.innerHTML="";
  if(cancelled){
    const el=document.createElement("div");el.className="step done";el.style.cssText="color:#9B2C25;border-left-color:#9B2C25";
    el.textContent="আপনার অর্ডারটি বাতিল করা হয়েছে। প্রয়োজনে Halal Food-এর সঙ্গে যোগাযোগ করুন।";timeline.appendChild(el);
  }else{
    steps.forEach((s,i)=>{const el=document.createElement("div");el.className="step"+(i<=current?" done":"");el.textContent=s;timeline.appendChild(el);});
  }
  $("#items").innerHTML=(data.items||[]).map(x=>'<div class="item"><span>'+esc(x.product)+' × '+Number(x.quantity||1)+'</span><b>'+money(x.lineTotal)+'</b></div>').join("");
  $("#updated").textContent=data.lastUpdated?"Last updated: "+new Date(data.lastUpdated).toLocaleString("en-BD"):"";
  $("#result").style.display="block";
}
$("#track-form").addEventListener("submit",async e=>{
  e.preventDefault();$("#error").style.display="none";$("#result").style.display="none";
  const btn=$("#track-btn");btn.disabled=true;btn.textContent="Checking...";
  try{
    const id=$("#order-id").value.trim().toUpperCase();
    const mobile=normalizeMobile($("#mobile").value);
    if(!id||!mobile)throw new Error("Order ID and mobile number are required.");
    const response=await fetch(API+"?orderId="+encodeURIComponent(id)+"&mobile="+encodeURIComponent(mobile),{method:"GET",cache:"no-store"});
    const data=await response.json().catch(()=>null);
    if(!response.ok||!data?.success)throw new Error(data?.error||"অর্ডারের তথ্য পাওয়া যায়নি।");
    render(data);
  }catch(err){
    $("#error").textContent=err.message||"অর্ডারের তথ্য পাওয়া যায়নি।";
    $("#error").style.display="block";
  }finally{btn.disabled=false;btn.textContent="Track Order";}
});
</script>

<script id="hf-contact-widget-script">
(function(){
  var root=document.getElementById('hf-contact-widget');
  var trigger=document.getElementById('hf-contact-launcher');
  var options=document.getElementById('hf-contact-options');
  if(!root||!trigger||!options)return;
  trigger.addEventListener('click',function(){
    var open=trigger.getAttribute('aria-expanded')==='true';
    trigger.setAttribute('aria-expanded',String(!open));
    options.hidden=open;
  });
  document.addEventListener('click',function(e){
    if(!root.contains(e.target)){options.hidden=true;trigger.setAttribute('aria-expanded','false');}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){options.hidden=true;trigger.setAttribute('aria-expanded','false');}
  });
})();
</script>
