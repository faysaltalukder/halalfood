<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Orders · Halal Food Admin</title><link rel="stylesheet" href="./shared.css?v=20261106-wordpress-categories-v1"><link rel="stylesheet" href="./workspace-global-theme.css?v=20261101-merchant-fieldbook-v1"><link rel="stylesheet" href="./website-orders.css?v=20261107-orders-v1"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script></head><body data-page="wordpress"><div id="authGate" class="auth-gate"><div class="auth-gate-card"><strong>Checking secure admin access…</strong><p>Only the authorized website owner can view these orders.</p></div></div><div id="adminApp" hidden><main class="hf-orders-page" id="pageContent" tabindex="-1"><header class="hf-orders-head"><div><span class="hf-orders-kicker">NEON COMMERCE · PRIVATE ADMIN</span><h1 id="hfOrdersTitle">Website Orders</h1><p>Orders placed through this storefront. Customer information is visible only to the website owner.</p></div><div class="hf-orders-actions"><a class="hf-orders-btn secondary" id="hfBackPages">Website pages</a><a class="hf-orders-btn secondary" id="hfPublicSite" target="_blank" rel="noopener">Storefront ↗</a></div></header><div id="hfOrdersStatus" class="hf-orders-status" role="status" aria-live="polite">Connecting to Neon…</div><section class="hf-orders-summary" id="hfOrdersSummary"></section><section class="hf-orders-tools"><input id="hfOrdersSearch" type="search" aria-label="Search orders by order number, customer or phone" placeholder="Search order, customer or phone…"><select id="hfOrdersFilter" aria-label="Filter orders by status"><option value="all">All statuses</option><option value="pending">Pending</option><option value="processing">Processing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select><button id="hfOrdersRefresh" class="hf-orders-btn" type="button">Refresh</button></section><section id="hfOrdersList" class="hf-orders-list"></section></main></div><script defer src="./i18n.js?v=20261102-dashboard-speed-v2"></script><script defer src="../js/store-config.js?v=20261101-store-config-v1"></script><script defer src="./shared.js?v=20261106-wordpress-categories-v1"></script><script defer src="./app.js?v=20261105-wordpress-live-preview-v4"></script><script type="module">
import { createClient } from "https://esm.sh/@neon/neon-js";
const client = createClient("https://ep-wild-lab-a1jqqu0p.ap-southeast-1.aws.neon.tech/halal_food_db", { auth: { allowAnonymous: true, fetchOptions: { credentials: "include" } } });
window.HFNeonClient = client;
window.HFNeonClientReady = Promise.resolve(client);
window.dispatchEvent(new Event("hf-neon-client-ready"));
if (location.pathname.includes("/admin/")) {
  const { data } = await client.auth.getSession();
  if (!data?.session?.user?.id) {
    const gate = document.createElement("div");
    gate.style.cssText = "position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:20px;background:rgba(15,23,42,.76);backdrop-filter:blur(8px);font:14px Arial,sans-serif";
    gate.innerHTML = '<form id="wp-neon-form" style="width:min(420px,100%);box-sizing:border-box;background:#fff;color:#243247;padding:28px;border-radius:18px;box-shadow:0 20px 70px #0005"><small style="letter-spacing:.14em;color:#9a673c;font-weight:800">WORDPRESS · NEON AUTH</small><h2 style="margin:12px 0">WordPress workspace sign-in</h2><p style="color:#64748b;line-height:1.5">This workspace uses its own Neon account. Halal Food Supabase credentials are not used for WordPress data.</p><label>Email<input id="wp-neon-email" type="email" required autocomplete="username" style="display:block;box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;border:1px solid #cbd5e1;border-radius:9px"></label><label>Password<input id="wp-neon-password" type="password" required autocomplete="current-password" style="display:block;box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;border:1px solid #cbd5e1;border-radius:9px"></label><button style="width:100%;padding:13px;border:0;border-radius:9px;background:#263b56;color:white;font-weight:800">Sign in</button><button type="button" id="wp-neon-reset" style="width:100%;margin-top:10px;padding:10px;border:0;background:transparent;color:#80552f;text-decoration:underline;cursor:pointer">Forgot password? Send reset email</button><p id="wp-neon-status" role="status" style="min-height:20px;color:#b42318;line-height:1.5"></p></form>';
    document.body.appendChild(gate);
    const form = gate.querySelector("#wp-neon-form"), status = gate.querySelector("#wp-neon-status");
    form.addEventListener("submit", async event => { event.preventDefault(); const email=gate.querySelector("#wp-neon-email").value.trim(),password=gate.querySelector("#wp-neon-password").value,button=form.querySelector('button[type="submit"]'); button.disabled=true; status.textContent="Signing in…"; try { const result=await client.auth.signIn.email({email,password}); if(result.error)throw result.error; location.reload(); } catch(error) { status.textContent=error.message||"Sign-in failed."; button.disabled=false; } });
    gate.querySelector("#wp-neon-reset").addEventListener("click",async()=>{const email=gate.querySelector("#wp-neon-email").value.trim();if(!email){status.textContent="Enter the WordPress account email first.";return;}status.textContent="Requesting password reset…";try{const result=await client.auth.requestPasswordReset({email,redirectTo:location.href.split("?")[0]});if(result.error)throw result.error;status.textContent="If the account exists, Neon will send a password reset email.";}catch(error){status.textContent=error.message||"Could not request a reset email."; }});
  }
}
</script>
<script defer src="./neon-builder-api.js?v=20261107-neon-auth-v1"></script><script defer src="./website-orders.js?v=20261107-orders-v1"></script></body></html>
