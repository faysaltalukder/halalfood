<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halal Food Admin</title>
<style>
:root{--navy:#17263c;--cream:#f7f3eb;--white:#fff;--muted:#667085;--border:#e7e2d9;--gold:#c99220}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--navy)}
header{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:18px}
main{max-width:1250px;margin:26px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 7px 28px #17263c0c}
h1,h2{margin:0 0 8px}.muted{color:var(--muted)}form{display:grid;gap:11px;max-width:400px}
input,button,select{font:inherit;padding:11px 13px;border-radius:10px;border:1px solid var(--border)}button{background:var(--navy);color:#fff;border:0;cursor:pointer}.secondary{background:#eee;color:var(--navy)}
.link{background:none;color:var(--navy);padding:4px 0;text-align:left}.hidden{display:none!important}.msg{min-height:22px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat strong{display:block;font-size:28px;margin-top:7px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:flex;gap:8px;align-items:center}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--border);white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:var(--muted)}
.badge{padding:5px 9px;border-radius:999px;background:#f0eee8;font-size:12px}.details{display:none;background:#fbf9f4}.details.open{display:table-row}.item{display:flex;gap:10px;align-items:center;padding:7px 0}.item img{width:48px;height:48px;object-fit:contain;background:#f3eee4;border-radius:8px}
.status{min-width:125px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><strong>Halal Food — Admin</strong><button id="logout" class="secondary hidden">Logout</button></header>
<main>
<section id="authCard" class="card">
<h1 id="authTitle">Admin Login</h1>
<p class="muted">Authorized account: halalfoodbd.official@gmail.com</p>
<form id="authForm"><input id="email" type="email" value="halalfoodbd.official@gmail.com" required><input id="password" type="password" minlength="8" placeholder="Password" required><button id="authButton">Sign in</button></form>
<button id="toggleSignup" class="link">First time? Create the admin account</button>
<p id="authMsg" class="msg muted"></p>
</section>

<section id="dashboard" class="hidden">
<div class="top"><div><h1>Dashboard</h1><p class="muted">Orders are stored in Supabase in parallel with the existing Google Sheet.</p></div><div class="actions"><button id="refresh">Refresh</button></div></div>
<div class="stats">
<div class="card stat"><span class="muted">Orders</span><strong id="ordersCount">0</strong></div>
<div class="card stat"><span class="muted">Pending</span><strong id="pendingCount">0</strong></div>
<div class="card stat"><span class="muted">Delivered</span><strong id="deliveredCount">0</strong></div>
<div class="card stat"><span class="muted">Revenue</span><strong id="revenue">৳0</strong></div>
</div>
<div class="card"><div class="top"><h2>Orders</h2><span id="lastUpdated" class="muted"></span></div>
<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Time</th><th></th></tr></thead><tbody id="ordersBody"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody></table></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qfwvrcfkrsydycbfjsxf.supabase.co";
const SUPABASE_KEY="sb_publishable_X32Rb8W-axGIfgFuppdfZQ_jbc38pcL";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let signup=false, cache=[];

function money(n){return "৳"+Number(n||0).toLocaleString("en-BD",{maximumFractionDigits:2})}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setAuthMode(){signup=!signup;$("authTitle").textContent=signup?"Create Admin Account":"Admin Login";$("authButton").textContent=signup?"Create account":"Sign in";$("toggleSignup").textContent=signup?"Already have an account? Sign in":"First time? Create the admin account";$("authMsg").textContent=""}
$("toggleSignup").onclick=setAuthMode;

$("authForm").addEventListener("submit",async e=>{
 e.preventDefault(); $("authMsg").textContent=signup?"Creating account…":"Signing in…";
 const email=$("email").value.trim(),password=$("password").value;
 let result;
 if(signup) result=await client.auth.signUp({email,password});
 else result=await client.auth.signInWithPassword({email,password});
 if(result.error){$("authMsg").textContent=result.error.message;return}
 if(signup && !result.data.session){$("authMsg").textContent="Account created. Check the email inbox to confirm the account, then sign in."}
 else $("authMsg").textContent="";
});

async function load(){
 const {data,error}=await client.from("orders").select("id,order_number,customer_name,customer_phone,customer_email,delivery_address,total,status,ordered_at,order_items(id,product_name,quantity,unit,unit_price,line_total,product_image_url)").order("ordered_at",{ascending:false}).limit(100);
 if(error){$("ordersBody").innerHTML='<tr><td colspan="7">'+escapeHtml(error.message)+'</td></tr>';return}
 cache=data||[];
 $("ordersCount").textContent=cache.length;
 $("pendingCount").textContent=cache.filter(x=>x.status==="pending").length;
 $("deliveredCount").textContent=cache.filter(x=>x.status==="delivered").length;
 $("revenue").textContent=money(cache.filter(x=>x.status!=="cancelled").reduce((s,x)=>s+Number(x.total||0),0));
 $("lastUpdated").textContent="Updated "+new Date().toLocaleTimeString("en-BD");
 $("ordersBody").innerHTML=cache.length?cache.map((x,i)=>{
   const items=(x.order_items||[]).map(it=>'<div class="item">'+(it.product_image_url?'<img src="'+escapeHtml(it.product_image_url)+'" alt="">':'')+'<span>'+escapeHtml(it.product_name)+' × '+escapeHtml(it.quantity)+' '+escapeHtml(it.unit)+' — '+money(it.line_total)+'</span></div>').join("")||'<span class="muted">No items</span>';
   return '<tr><td>'+(escapeHtml(x.order_number||x.id.slice(0,8)))+'</td><td>'+escapeHtml(x.customer_name)+'</td><td>'+escapeHtml(x.customer_phone)+'</td><td>'+money(x.total)+'</td><td><select class="status" data-status="'+x.id+'">'+["pending","processing","shipped","delivered","cancelled"].map(s=>'<option '+(s===x.status?'selected':'')+'>'+s+'</option>').join("")+'</select></td><td>'+new Date(x.ordered_at).toLocaleString("en-BD")+'</td><td><button class="secondary" data-detail="'+i+'">Details</button></td></tr><tr class="details" id="detail-'+i+'"><td colspan="7"><b>Address:</b> '+escapeHtml(x.delivery_address)+'<br><b>Email:</b> '+escapeHtml(x.customer_email||"—")+'<br>'+items+'</td></tr>';
 }).join(""):'<tr><td colspan="7" class="muted">No orders yet.</td></tr>';
 document.querySelectorAll("[data-status]").forEach(el=>el.addEventListener("change",()=>updateStatus(el.dataset.status,el.value)));
 document.querySelectorAll("[data-detail]").forEach(el=>el.addEventListener("click",()=>$(("detail-"+el.dataset.detail)).classList.toggle("open")));
}
async function updateStatus(id,status){
 const {error}=await client.from("orders").update({status,updated_at:new Date().toISOString()}).eq("id",id);
 if(error){alert(error.message);load();return}
 load();
}
$("refresh").onclick=load;
$("logout").onclick=()=>client.auth.signOut();

client.auth.onAuthStateChange((_event,session)=>{
 const ok=!!session;
 $("authCard").classList.toggle("hidden",ok);
 $("dashboard").classList.toggle("hidden",!ok);
 $("logout").classList.toggle("hidden",!ok);
 if(ok)load();
});
client.auth.getSession().then(({data})=>{if(data.session)load()});
</script>
</body></html>
